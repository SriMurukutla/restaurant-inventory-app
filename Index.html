<!DOCTYPE html><html><head><base target="_top"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
:root{font-family:system-ui;color:#18332c;background:#f3f6f3}body{margin:0}header{background:#153e33;color:white;padding:22px}main{max-width:1200px;margin:auto;padding:20px}h1{margin:0;font-size:25px}h2{font-size:21px}button,input,select,textarea{font:inherit;padding:10px;border:1px solid #bdcbc4;border-radius:6px}button{cursor:pointer;background:#20634f;color:white}button.secondary{background:white;color:#18332c}button:disabled{opacity:.5}input,select{max-width:100%;box-sizing:border-box}label{display:inline-flex;flex-direction:column;gap:5px;margin:5px}textarea{width:95%;min-height:85px}section,.card{background:white;border:1px solid #dce5de;border-radius:10px;padding:18px;margin:15px 0}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}nav{display:flex;flex-wrap:wrap;gap:7px;margin:15px 0}table{border-collapse:collapse;width:100%}td,th{text-align:left;padding:10px;border-bottom:1px solid #e1e7e2}th{background:#edf3ee}.scroll{overflow:auto}small,.muted{color:#536b60}.low{color:#a54413;font-weight:bold}#message{position:sticky;top:0;background:#fff5c9;padding:12px;z-index:10;white-space:pre-wrap}a{color:#20634f}.line{display:flex;gap:5px;flex-wrap:wrap;margin:7px 0}.line input{width:125px}.line input.sku{width:260px}.metric{font-size:28px}.hidden{display:none!important}svg{max-width:100%}
</style></head><body><header><h1>Restaurant Inventory</h1><div>Restaurant + Garage · Stock, purchasing and approvals</div></header><main>
<div id="message" role="status" class="hidden"></div><section id="login"><h2>Sign in</h2><form id="loginForm"><label>Account<select id="username"><option>owner</option><option>manager</option><option>staff</option></select></label><label>Password<input id="password" type="password" required autocomplete="current-password"></label><button>Sign in</button></form></section>
<div id="app" class="hidden"><div class="row"><strong id="identity"></strong><button id="refresh" class="secondary">Refresh</button><button id="logout" class="secondary">Log out</button><small>Refreshes every 60 seconds while idle.</small></div><nav id="nav"></nav><div id="view"></div></div><datalist id="skus"></datalist><datalist id="suppliers"></datalist></main>
<script>
'use strict';
let token='',data=null,page='Stock',busy=false,receiptDraft=null;
const $=id=>document.getElementById(id),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=x=>Number(x).toLocaleString('en-US',{style:'currency',currency:'USD'});
const defaults=['Restaurant Depot',"Sam's",'Costco','Browns','Produce','Online','Third-party'];
function message(s){$('message').textContent=s;$('message').classList.toggle('hidden',!s)}
function rpc(name,...args){return new Promise((resolve,reject)=>google.script.run.withSuccessHandler(resolve).withFailureHandler(e=>reject(Error(e.message||e)))[name](...args));}
function uuid(){return crypto.randomUUID?crypto.randomUUID():Date.now().toString(16)+'-'+Array.from(crypto.getRandomValues(new Uint32Array(4))).join('-')}
async function run(fn){if(busy)return;busy=true;document.querySelectorAll('button').forEach(b=>b.disabled=true);try{await fn()}catch(e){message(e.message)}finally{busy=false;document.querySelectorAll('button').forEach(b=>b.disabled=false)}}
async function load(render=true){data=await rpc('getData',token);$('identity').textContent='Signed in as '+data.role;
  $('skus').innerHTML=data.items.map(i=>`<option value="${esc(i.sku)}">${esc(i.name)} (${esc(i.unit)})</option>`).join('');
  $('suppliers').innerHTML=[...new Set([...defaults,...data.items.flatMap(i=>i.suppliers||[])])].map(s=>`<option value="${esc(s)}">`).join('');if(render)draw();}
async function save(action,payload,id=uuid()){await rpc('mutate',token,id,action,payload);message('Saved.');await load();}
$('loginForm').onsubmit=e=>{e.preventDefault();run(async()=>{const r=await rpc('login',$('username').value,$('password').value);token=r.token;$('password').value='';await load();$('login').classList.add('hidden');$('app').classList.remove('hidden');message('');})};
$('logout').onclick=()=>{token='';data=null;receiptDraft=null;$('view').innerHTML='';$('app').classList.add('hidden');$('login').classList.remove('hidden');message('Logged out on this browser.');};
$('refresh').onclick=()=>run(()=>load());
setInterval(()=>{if(token&&!busy&&!['Delivery','Catalog','Approvals','Import'].includes(page))run(()=>load());},60000);
function table(headers,rows){return `<div class="scroll"><table><thead><tr>${headers.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${rows.join('')||'<tr><td>No records yet.</td></tr>'}</tbody></table></div>`}
function row(cells){return '<tr>'+cells.map(c=>'<td>'+c+'</td>').join('')+'</tr>'}
function field(label,id,value='',attrs=''){return `<label>${esc(label)}<input id="${id}" value="${esc(value)}" ${attrs}></label>`}
function loc(id,value='restaurant'){return `<label>Location<select id="${id}"><option ${value==='restaurant'?'selected':''}>restaurant</option><option ${value==='garage'?'selected':''}>garage</option></select></label>`}
function draw(){const pages=data.role==='staff'?['Stock','Delivery','Transfers']:['Stock','Delivery','Approvals','Transfers','Shopping','Reports','Catalog','Import'];
$('nav').innerHTML=pages.map(p=>`<button class="${p===page?'':'secondary'}" data-page="${p}">${p}</button>`).join('');$('nav').querySelectorAll('button').forEach(b=>b.onclick=()=>{page=b.dataset.page;receiptDraft=null;message('');draw()});
({Stock:stock,Delivery:delivery,Approvals:approvals,Transfers:transfers,Shopping:shopping,Reports:reports,Catalog:catalog,Import:imports}[page]||stock)();}
function stock(){ $('view').innerHTML='<section><h2>Stock on hand</h2><input id="search" placeholder="Search name, SKU, category"><div id="stockTable"></div></section>';
 const render=()=>{$('stockTable').innerHTML=table(['SKU / Item','Unit','Restaurant','Garage','Total','Actions'],data.items.filter(i=>(i.sku+' '+i.name+' '+i.category).toLowerCase().includes($('search').value.toLowerCase())).map(i=>row([esc(i.sku)+'<br>'+esc(i.name),esc(i.unit),esc(i.restaurant),esc(i.garage),`<span class="${i.restaurant+i.garage<i.target?'low':''}">${+(i.restaurant+i.garage).toFixed(4)}</span>`,`<button data-finish="${esc(i.sku)}">Finished</button> <button data-transfer="${esc(i.sku)}">Request transfer</button> ${data.role!=='staff'?`<button data-adjust="${esc(i.sku)}">Count / adjust</button>`:''}`])));
 $('stockTable').querySelectorAll('[data-finish]').forEach(b=>b.onclick=()=>{const i=data.items.find(i=>i.sku===b.dataset.finish);if(confirm('Set restaurant stock of '+i.name+' to zero?'))run(()=>save('stock',{sku:i.sku,location:'restaurant',expected:i.restaurant,value:0,reason:'Marked finished'}));});
 $('stockTable').querySelectorAll('[data-transfer]').forEach(b=>b.onclick=()=>{const qty=prompt('Quantity to move from garage to restaurant?');if(qty!==null)run(()=>save('transfer',{sku:b.dataset.transfer,qty}));});
 $('stockTable').querySelectorAll('[data-adjust]').forEach(b=>b.onclick=()=>{const i=data.items.find(i=>i.sku===b.dataset.adjust),location=prompt('Location: restaurant or garage','restaurant');if(!['restaurant','garage'].includes(location))return;const value=prompt('New counted quantity in '+i.unit,String(i[location]));if(value===null)return;const reason=prompt('Reason for adjustment');if(reason)run(()=>save('stock',{sku:i.sku,location,value,expected:i[location],reason}));});};$('search').oninput=render;render();}
function lineEditor(lines){return '<div id="lines">'+lines.map(lineHTML).join('')+'</div><button id="addLine" type="button" class="secondary">Add line</button>'}
function lineHTML(l={}){return `<div class="line"><input class="sku" list="skus" placeholder="SKU" value="${esc(l.sku||'')}" aria-label="SKU"><input class="qty" type="number" min="0.0001" step="any" placeholder="Quantity" value="${esc(l.qty??'')}" aria-label="Quantity"><input class="price" type="number" min="0" step="any" placeholder="Unit price" value="${esc(l.price??'')}" aria-label="Unit price"><button type="button" class="remove secondary">Remove</button></div>`}
function wireLines(){const wire=()=>document.querySelectorAll('.remove').forEach(b=>b.onclick=()=>b.parentNode.remove());$('addLine').onclick=()=>{$('lines').insertAdjacentHTML('beforeend',lineHTML());wire()};wire();}
function readLines(){return [...$('lines').children].map(el=>({sku:el.querySelector('.sku').value.trim(),qty:el.querySelector('.qty').value,price:el.querySelector('.price').value}));}
function receiptForm(r={}){return `<div class="row">${field('Delivery date','date',r.date||new Date().toLocaleDateString('en-CA'), 'type="date"')}${field('Supplier','supplier',r.supplier||'','list="suppliers"')}${loc('location',r.location)}${field('Invoice / reference','reference',r.reference||'')}${field('Tax / shipping / other ($)','extra',r.extra||0,'type="number" min="0" step="any"')}</div><p>Use the item's stock unit. Unit price is the price per stock unit, not the line total. Create missing SKUs in Catalog first.</p>${lineEditor(r.lines||[])} `}
function readReceipt(){return {date:$('date').value,supplier:$('supplier').value,location:$('location').value,reference:$('reference').value,extra:$('extra').value,lines:readLines()};}
function delivery(){ $('view').innerHTML=`<section><h2>Submit delivery for approval</h2><p>Upload a receipt or enter lines manually. Nothing changes stock until an owner or manager approves. Staff can enter prices but cannot retrieve saved prices.</p>${receiptForm()}<p><label>Receipt photo or PDF (up to 5 MB)<input id="file" type="file" accept="image/jpeg,image/png,application/pdf"></label></p><label>Notes<textarea id="note"></textarea></label><p><button id="submitReceipt">Submit for approval</button></p></section>`;wireLines();const id=uuid();$('submitReceipt').onclick=()=>run(async()=>{const d=readReceipt();d.note=$('note').value;const f=$('file').files[0];if(f){if(f.size>5*1024*1024)throw Error('Maximum attachment size is 5 MB');const url=await new Promise((res,rej)=>{const reader=new FileReader();reader.onload=()=>res(reader.result);reader.onerror=rej;reader.readAsDataURL(f)});d.file={mime:f.type,base64:url.split(',')[1]};}await save('receipt',d,id);});}
function approvals(){const pending=data.receipts.filter(r=>r.status==='pending');$('view').innerHTML='<section><h2>Receipt approvals</h2><p>Check invoice number and attachment for duplicates before approving. Review every line, unit and price.</p>'+table(['Date','Supplier / reference','Submitted by','Attachment','Action'],pending.map(r=>row([esc(r.date),esc(r.supplier)+' / '+esc(r.reference),esc(r.by),r.fileId?`<button data-file="${esc(r.id)}">Download receipt</button>`:'Manual',`<button data-review="${esc(r.id)}">Review</button>`])))+'<div id="review"></div></section>';wireFiles();document.querySelectorAll('[data-review]').forEach(b=>b.onclick=()=>{const r=pending.find(r=>r.id===b.dataset.review);$('review').innerHTML=`<hr><h2>Review ${esc(r.supplier)}</h2><p>Staff notes: ${esc(r.note)}</p>${receiptForm(r)}<label>Review note<textarea id="reviewNote"></textarea></label><p><button id="approve">Approve and update stock</button> <button id="reject" class="secondary">Reject</button></p>`;wireLines();$('approve').onclick=()=>{if(confirm('Approve this receipt and add its quantities to stock?'))run(()=>save('receiptDecision',{id:r.id,approve:true,receipt:readReceipt(),note:$('reviewNote').value}));};$('reject').onclick=()=>run(()=>save('receiptDecision',{id:r.id,approve:false,note:$('reviewNote').value}));});}
function download(name,body,type){const url=URL.createObjectURL(new Blob([body],{type})),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),10000)}
function wireFiles(){document.querySelectorAll('[data-file]').forEach(b=>b.onclick=()=>run(async()=>{const f=await rpc('getReceiptFile',token,b.dataset.file),bytes=Uint8Array.from(atob(f.base64),c=>c.charCodeAt(0));download('receipt-'+b.dataset.file+(f.mime==='application/pdf'?'.pdf':f.mime==='image/png'?'.png':'.jpg'),bytes,f.mime)}));}
function transfers(){ $('view').innerHTML='<section><h2>Garage → restaurant requests</h2>'+table(['SKU','Quantity','Requested by','Status','Action'],data.transfers.slice().reverse().map(t=>row([esc(t.sku),esc(t.qty),esc(t.by),esc(t.status),data.role!=='staff'&&t.status==='pending'?`<button data-yes="${esc(t.id)}">Confirm moved</button> <button data-no="${esc(t.id)}">Reject</button>`:''])))+'</section>';document.querySelectorAll('[data-yes],[data-no]').forEach(b=>b.onclick=()=>run(()=>save('transferDecision',{id:b.dataset.yes||b.dataset.no,approve:!!b.dataset.yes})));}
function shopping(){const groups=Object.create(null);data.items.filter(i=>i.restaurant+i.garage<i.target).forEach(i=>{const supplier=i.primary||'Unassigned';(groups[supplier]??=[]).push(i)});$('view').innerHTML='<section><h2>Automatic shopping lists</h2><p>Needed = target − (restaurant + garage). Each item appears once, under its primary supplier. Pending deliveries and requests do not change this list.</p>'+Object.entries(groups).map(([supplier,items])=>'<h3>'+esc(supplier)+'</h3>'+table(['Item','Total','Target','Buy quantity','Unit','Other suppliers'],items.map(i=>row([esc(i.name)+' ('+esc(i.sku)+')',+(i.restaurant+i.garage).toFixed(4),i.target,+(i.target-i.restaurant-i.garage).toFixed(4),esc(i.unit),esc(i.suppliers.filter(s=>s!==i.primary).join(', '))])))).join('')+(!Object.keys(groups).length?'<p>All items are at or above target.</p>':'')+'<p><button id="exportShopping">Download shopping CSV</button></p></section>';$('exportShopping').onclick=()=>csvDownload('shopping.csv',['Supplier','SKU','Name','Quantity','Unit'],Object.entries(groups).flatMap(([supplier,items])=>items.map(i=>[supplier,i.sku,i.name,+(i.target-i.restaurant-i.garage).toFixed(4),i.unit])));}
function reports(){const approved=data.receipts.filter(r=>r.status==='approved'),months={};approved.forEach(r=>{const key=r.date.slice(0,7);months[key]=(months[key]||0)+r.lines.reduce((n,l)=>n+l.qty*l.price,0)+r.extra});$('view').innerHTML='<section><h2>Monthly spend</h2><p>Approved deliveries, grouped by delivery date. Includes entered tax / shipping. This is purchasing spend, not usage or cost of goods sold.</p>'+table(['Month','Spend'],Object.keys(months).sort().reverse().map(m=>row([m,money(months[m])])))+'</section><section><h2>Price history and trend</h2>'+field('SKU','trendSku','','list="skus"')+'<div id="trend"></div></section><section><h2>Receipt history</h2>'+table(['Date','Supplier','Reference','Status','Total','Attachment'],data.receipts.slice().reverse().map(r=>row([esc(r.date),esc(r.supplier),esc(r.reference),esc(r.status),r.status==='approved'?money(r.lines.reduce((n,l)=>n+l.qty*l.price,0)+r.extra):'—',r.fileId?`<button data-file="${esc(r.id)}">Download</button>`:'—'])))+'<button id="exportPrices">Download price history CSV</button></section>';wireFiles();$('trendSku').oninput=()=>{const prices=data.prices.filter(p=>p.sku===$('trendSku').value).sort((a,b)=>a.date.localeCompare(b.date)),max=Math.max(1,...prices.map(p=>p.price));const points=prices.map((p,i)=>`${30+i*640/Math.max(1,prices.length-1)},${170-p.price/max*140}`).join(' ');$('trend').innerHTML=(prices.length?`<p>First ${money(prices[0].price)} → latest ${money(prices.at(-1).price)} per stock unit ${prices[0].price?'('+((prices.at(-1).price/prices[0].price-1)*100).toFixed(1)+'%)':''}</p><svg viewBox="0 0 720 200" role="img" aria-label="Unit price by purchase order, oldest to newest"><line x1="30" y1="170" x2="680" y2="170" stroke="#aaa"/><polyline points="${points}" fill="none" stroke="#20634f" stroke-width="3"/>${prices.map((p,i)=>`<circle cx="${30+i*640/Math.max(1,prices.length-1)}" cy="${170-p.price/max*140}" r="4" fill="#20634f"><title>${esc(p.date)} ${money(p.price)}</title></circle>`).join('')}</svg><small>Purchase sequence, oldest → newest; vertical scale $0–${max.toFixed(2)}.</small>`:'')+table(['Date','Supplier','Quantity','Unit price'],prices.map(p=>row([esc(p.date),esc(p.supplier),p.qty,money(p.price)])));};$('exportPrices').onclick=()=>csvDownload('price-history.csv',['Date','SKU','Supplier','Quantity','Unit price'],data.prices.map(p=>[p.date,p.sku,p.supplier,p.qty,p.price]));}
function catalog(){ $('view').innerHTML=`<section><h2>Add or update an item</h2><p>Choose an existing SKU to edit. Keep units consistent (e.g. pounds, each, cases). Opening quantities are entered with Stock → Count / adjust.</p>${field('SKU','sku','','list="skus"')}${field('Name','name')}${field('Stock unit','unit','each')}${field('Category','category')}${field('Reorder target','target',0,'type="number" min="0" step="any"')}${field('Primary supplier','primary','','list="suppliers"')}<label>All suppliers separated by |<input id="allSuppliers" placeholder="Costco|Restaurant Depot"></label><p><button id="saveItem">Save item</button> <button id="exportCatalog" class="secondary">Export catalog CSV</button></p></section>`;
 $('sku').onchange=()=>{const i=data.items.find(i=>i.sku===$('sku').value);if(i){['name','unit','category','target','primary'].forEach(k=>$(k).value=i[k]);$('allSuppliers').value=i.suppliers.join('|');}};
 $('saveItem').onclick=()=>run(()=>save('catalog',{items:[{sku:$('sku').value,name:$('name').value,unit:$('unit').value,category:$('category').value,target:$('target').value,primary:$('primary').value,suppliers:$('allSuppliers').value}]}));
 $('exportCatalog').onclick=()=>csvDownload('catalog.csv',cols,data.items.map(i=>cols.map(c=>c==='suppliers'?i.suppliers.join('|'):i[c])));}
const cols=['sku','name','unit','category','target','suppliers','primary'];
function parseCSV(text){const rows=[];let row=[],cell='',quoted=false;text=text.replace(/^\uFEFF/,'');for(let i=0;i<text.length;i++){const c=text[i];if(c==='"'){if(quoted&&text[i+1]==='"'){cell+='"';i++}else if(!quoted&&cell.length)throw Error('Invalid CSV quote');else quoted=!quoted;}else if(c===','&&!quoted){row.push(cell);cell='';}else if((c==='\n'||c==='\r')&&!quoted){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cell);if(row.some(x=>x!==''))rows.push(row);row=[];cell='';}else cell+=c;}if(quoted)throw Error('Unclosed CSV quote');row.push(cell);if(row.some(x=>x!==''))rows.push(row);return rows;}
function csvDownload(name,headers,rows){const safe=v=>{let s=String(v??'');if(/^[=+\-@\t\r]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"'};download(name,'\uFEFF'+[headers,...rows].map(r=>r.map(safe).join(',')).join('\r\n'),'text/csv;charset=utf-8');}
function imports(){ $('view').innerHTML=`<section><h2>Bulk catalog import</h2><p>Excel: Save As → CSV UTF-8 first. Or paste CSV below. Required header: <code>${cols.join(',')}</code>. Suppliers use |. Existing SKUs update metadata; stock stays unchanged. New items start at zero.</p><input id="csvFile" type="file" accept=".csv,text/csv"><p><textarea id="csvText" placeholder="${cols.join(',')}"></textarea></p><button id="previewImport">Validate and preview</button><div id="importPreview"></div></section>`;$('csvFile').onchange=async()=>{if($('csvFile').files[0])$('csvText').value=await $('csvFile').files[0].text()};$('previewImport').onclick=()=>run(async()=>{const rows=parseCSV($('csvText').value);if(!rows.length)throw Error('CSV is empty');const header=rows.shift().map(x=>x.trim().toLowerCase());if(header.join(',')!==cols.join(','))throw Error('Header must exactly match the shown order');const seen=new Set();const items=rows.map((r,index)=>{if(r.length!==cols.length)throw Error('Wrong column count at row '+(index+2));const i=Object.fromEntries(cols.map((c,j)=>[c,r[j].trim()]));if(!/^[A-Za-z0-9][A-Za-z0-9_. -]{0,79}$/.test(i.sku)||!i.name||i.target===''||!Number.isFinite(Number(i.target))||Number(i.target)<0||Number(i.target)>1e9||seen.has(i.sku))throw Error('Invalid or duplicate SKU, name or target at row '+(index+2));seen.add(i.sku);if(Object.values(i).some(v=>v.length>200))throw Error('Text too long at row '+(index+2));const old=data.items.find(x=>x.sku===i.sku);if(old&&old.unit!==(i.unit||'each'))throw Error('Unit cannot change: '+i.sku);return i;});if(!items.length)throw Error('No items');$('importPreview').innerHTML='<p>'+items.length+' items validated. '+items.filter(i=>data.items.some(x=>x.sku===i.sku)).length+' existing SKUs will be updated.</p>'+table(cols,items.slice(0,10).map(i=>row(cols.map(c=>esc(i[c])))))+'<p><button id="commitImport">Import all validated items</button></p>';const batches=[];for(let i=0;i<items.length;i+=25)batches.push({id:uuid(),items:items.slice(i,i+25)});$('commitImport').onclick=()=>run(async()=>{let done=0;for(const b of batches){message('Importing '+done+' / '+items.length+'…');await rpc('mutate',token,b.id,'catalog',{items:b.items});done+=b.items.length;}message('Imported '+done+' items.');await load();});});}
</script></body></html>
